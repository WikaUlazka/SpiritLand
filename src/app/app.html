
<header class="navbar">
  <div class="container">
    <h1 class="logo" routerLink="/">Spiritland 🎲</h1>

    <nav class="nav-links">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Start
      </a>

      <ng-container *ngIf="auth.isLogged(); else guestLinks">
        <a routerLink="/games" routerLinkActive="active">Gry</a>
        <a routerLink="/game-invites" routerLinkActive="active">
          Zaproszenia
        </a>
        <a routerLink="/spirits" routerLinkActive="active">Duchy</a>
        <a routerLink="/scenarios" routerLinkActive="active">Scenariusze</a>
        <a routerLink="/adversaries" routerLinkActive="active">Przeciwnicy</a>
        <a routerLink="/users" routerLinkActive="active">Profil</a>
        <a (click)="logout()" class="logout-btn">Wyloguj</a>
      </ng-container>

      <ng-template #guestLinks>
        <a routerLink="/spirits" routerLinkActive="active">Duchy</a>
        <a routerLink="/scenarios" routerLinkActive="active">Scenariusze</a>
        <a routerLink="/adversaries" routerLinkActive="active">Przeciwnicy</a>
        <a routerLink="/login" routerLinkActive="active">Logowanie</a>
        <a routerLink="/register" routerLinkActive="active">Rejestracja</a>
      </ng-template>
    </nav>
  </div>
</header>

<main class="content">
  <router-outlet></router-outlet>
</main>

<footer class="footer">
  <p>© 2026 Spiritland · Twoje rozgrywki Spirit Island</p>
</footer>
